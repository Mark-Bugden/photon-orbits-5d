[project]
name = "photon-orbits"
version = "0.1.0"
description = "Reference model of spherical photon orbits around a 5D Myers-Perry black hole, for the Tracing the Trajectories demo."
readme = "README.md"
license = "MIT"
authors = [{ name = "Mark Bugden" }]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "numpy>=2.5.5",
    "pytest>=9.2.0",
    "scipy>=1.18.1",
    "sympy>=1.14.0",
]
